apiVersion: lcm.openshift.io/v1alpha1
kind: ImageBasedGroupUpgrade
metadata:
  name: upgrade-4.15.0
  namespace: default
  annotations:
    cluster-group-upgrades-operator/name-suffix: kuttl
    auto-rollback-on-failure.lca.openshift.io/post-reboot-config: Disabled
    auto-rollback-on-failure.lca.openshift.io/upgrade-completion: Disabled
    auto-rollback-on-failure.lca.openshift.io/init-monitor: Disabled
    # The seed-format pre-flight (CNF-30039) now reads the seed image from the
    # registry for every in-scope IBGU, not only backupContent ones. kuttl has no
    # real registry and uses a placeholder seed reference, so the gate would
    # fail-closed (SeedImageUnreadable) and no Prep ManifestWork would be
    # generated. Opt out with the designed escape hatch so this test exercises the
    # Prep/Upgrade/finalize flow it is about.
    lcm.openshift.io/ibgu-skip-seed-compatibility-check: ""
spec:
  clusterLabelSelectors:
    - matchExpressions:
        - key: "name"
          operator: In
          values:
            - "spoke1"
            - "spoke4"
            - "spoke6"        
  ibuSpec:
    seedImageRef:
      image: quay.io/seed/image:4.15.0-rc.5
      version: 4.15.0-rc.5
  plan:
    - actions: ["Prep"]
      rolloutStrategy:
        maxConcurrency: 2
        timeout: 2400
