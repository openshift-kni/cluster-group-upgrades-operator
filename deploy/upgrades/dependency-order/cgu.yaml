apiVersion: ran.openshift.io/v1alpha1
kind: ClusterGroupUpgrade
metadata:
  name: cgu
  namespace: default
  annotations:
    cluster-group-upgrades-operator/name-suffix: kuttl      
spec:
  managedPolicies:
    - policy0-deporder-config-policy
    - policy1-deporder-cluster-version-policy
  enable: false
  clusters:
  - spoke1
  remediationStrategy:
    maxConcurrency: 4
