# Pre-stage spoke4 as already-Prepped for the step-01 Upgrade-only IBGU.
#
# The controller only selects a cluster for an Upgrade plan item once that cluster
# carries the completed-Prep label (ClusterMatchesPlanItem -> hasCompleted(Prep)).
# There is no live spoke/LCA in kuttl to drive a real Prep completion, and the
# plan-item-0 resolution is final once an IBGU resolves to zero eligible clusters
# and reports completion, so the label must exist before the Upgrade-only IBGU is
# created in step 01 (not merely eventually). Set it here in step 00, before that
# IBGU exists; 02-cleanup.yaml removes it again.
apiVersion: kuttl.dev/v1beta1
kind: TestStep

commands:
  - command: oc label managedcluster spoke4 lcm.openshift.io/ibgu-prep-completed= --overwrite
    ignoreFailure: false
