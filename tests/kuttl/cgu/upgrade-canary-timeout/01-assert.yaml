apiVersion: ran.openshift.io/v1alpha1
kind: ClusterGroupUpgrade
metadata:
  name: cgu-canary-timeout-fail
  namespace: default
spec:
  clusters:
  - spoke1
  - spoke2
  - spoke4
  - spoke6
  enable: true
  managedPolicies:
  - policy1-common-cluster-version-policy
  - policy2-common-pao-sub-policy
  remediationStrategy:
    canaries:
    - spoke1
    - spoke2
    maxConcurrency: 2
    timeout: 240
status:
  conditions:
  - message: All selected clusters are valid
    reason: ClusterSelectionCompleted
    status: 'True'
    type: ClustersSelected
  - message: Completed validation
    reason: ValidationCompleted
    status: 'True'
    type: Validated
  - message: Remediating non-compliant policies
    reason: InProgress
    status: 'True'
    type: Progressing
  managedPoliciesForUpgrade:
  - name: policy1-common-cluster-version-policy
    namespace: default
  - name: policy2-common-pao-sub-policy
    namespace: default
  managedPoliciesNs:
    policy1-common-cluster-version-policy: default
    policy2-common-pao-sub-policy: default
  placementBindings:
  - cgu-canary-timeout-fail-policy1-common-cluster-version-policy-placement-kuttl
  - cgu-canary-timeout-fail-policy2-common-pao-sub-policy-placement-kuttl
  placements:
  - cgu-canary-timeout-fail-policy1-common-cluster-version-policy-placement-kuttl
  - cgu-canary-timeout-fail-policy2-common-pao-sub-policy-placement-kuttl
  remediationPlan:
  - - spoke1
  - - spoke2
  - - spoke4
    - spoke6
  safeResourceNames:
    default/cgu-canary-timeout-fail-policy1-common-cluster-version-policy-placement: cgu-canary-timeout-fail-policy1-common-cluster-version-policy-placement-kuttl
    default/cgu-canary-timeout-fail-policy2-common-pao-sub-policy-placement: cgu-canary-timeout-fail-policy2-common-pao-sub-policy-placement-kuttl
  status:
    currentBatch: 1
    currentBatchRemediationProgress:
      spoke1:
        policyIndex: 0
        state: InProgress
---
apiVersion: cluster.open-cluster-management.io/v1
kind: ManagedCluster
metadata:
  labels:
    ztp-running: ''
  name: spoke1
---
apiVersion: cluster.open-cluster-management.io/v1
kind: ManagedCluster
metadata:
  labels:
    ztp-running: ''
  name: spoke2
---
apiVersion: cluster.open-cluster-management.io/v1
