apiVersion: ran.openshift.io/v1alpha1
kind: ClusterGroupUpgrade
metadata:
  name: cgu-canary-timeout-fail
  namespace: default
spec:
  clusters:
  - spoke1
  - spoke2
  - spoke4
  - spoke6
  enable: true
  managedPolicies:
  - policy1-common-cluster-version-policy
  - policy2-common-pao-sub-policy
  remediationStrategy:
    canaries:
    - spoke1
    - spoke2
    maxConcurrency: 2
    timeout: 0
status:
  conditions:
  - message: All selected clusters are valid
    reason: ClusterSelectionCompleted
    status: "True"
    type: ClustersSelected
  - message: Completed validation
    reason: ValidationCompleted
    status: "True"
    type: Validated
  - message: Policy remediation took too long
    reason: TimedOut
    status: "False"
    type: Progressing
  - message: Policy remediation took too long
    reason: TimedOut
    status: "False"
    type: Succeeded
  managedPoliciesForUpgrade:
  - name: policy1-common-cluster-version-policy
    namespace: default
  - name: policy2-common-pao-sub-policy
    namespace: default
  remediationPlan:
  - - spoke1
  - - spoke2
  - - spoke4
    - spoke6
---
apiVersion: v1
involvedObject:
  apiVersion: ran.openshift.io/v1alpha1
  kind: ClusterGroupUpgrade
  name: cgu-canary-timeout-fail
  namespace: default
kind: Event
message: 'ClusterGroupUpgrade cgu-canary-timeout-fail: some clusters in the batch index
  1 timed out remediating policies'
metadata:
  annotations:
    cgu.openshift.io/event-type: batch
    cgu.openshift.io/timedout-clusters: spoke1
  namespace: default
reason: CguTimedout
reportingComponent: ClusterGroupUpgrade
type: Warning
---
apiVersion: v1
involvedObject:
  apiVersion: ran.openshift.io/v1alpha1
  kind: ClusterGroupUpgrade
  name: cgu-canary-timeout-fail
  namespace: default
kind: Event
message: ClusterGroupUpgrade cgu-canary-timeout-fail timed-out remediating policies
metadata:
  annotations:
    cgu.openshift.io/event-type: global
  namespace: default
reason: CguTimedout
reportingComponent: ClusterGroupUpgrade
type: Warning
---
action: RemediationInBatchTimeout
apiVersion: events.k8s.io/v1
kind: Event
metadata:
  annotations:
    cgu.openshift.io/event-type: batch
    cgu.openshift.io/timedout-clusters: spoke1
  namespace: default
note: 'ClusterGroupUpgrade cgu-canary-timeout-fail: some clusters in the batch index
  1 timed out remediating policies'
reason: CguTimedout
regarding:
  apiVersion: ran.openshift.io/v1alpha1
  kind: ClusterGroupUpgrade
  name: cgu-canary-timeout-fail
  namespace: default
reportingController: ClusterGroupUpgrade
type: Warning
---
action: RemediationTimeout
apiVersion: events.k8s.io/v1
kind: Event
metadata:
  annotations:
    cgu.openshift.io/event-type: global
  namespace: default
note: ClusterGroupUpgrade cgu-canary-timeout-fail timed-out remediating policies
reason: CguTimedout
regarding:
  apiVersion: ran.openshift.io/v1alpha1
  kind: ClusterGroupUpgrade
  name: cgu-canary-timeout-fail
  namespace: default
reportingController: ClusterGroupUpgrade
type: Warning
