---
name: Backport merged PRs

on:  # yamllint disable-line rule:truthy
  push:
    branches: [release-5.0]

permissions:
  contents: write
  pull-requests: write

env:
  TARGET_BRANCH: release-4.23

# Different pushes must not cancel or replace one another in a shared queue.
# Deterministic branch names and create-only pushes handle duplicate attempts.
concurrency:
  group: backport-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  backport:
    if: github.repository == 'openshift-kni/cluster-group-upgrades-operator' && !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the pushed source history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.event.after }}
          fetch-depth: 0
          # Git uses the job-scoped GITHUB_TOKEN to push backport branches.
          persist-credentials: true

      - name: Create backport branches and pull requests
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            const {run} = require('./.github/scripts/backport.cjs');
            await run({github, context, core});
